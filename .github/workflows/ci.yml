name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (grep patterns)
        run: |
          ! grep -rE "(sk_live|pk_live|api[_-]?key\s*=\s*['\"][^'\"]+['\"])" src/ --include="*.ts" --include="*.tsx" || exit 1

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_ENABLE_MOCK_AUTH: "false"

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

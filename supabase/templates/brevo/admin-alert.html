<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="utf-8" /></head>
  <body dir="rtl" style="margin:0;padding:0;background:#f4f1ec;font-family:Tahoma,Arial,sans-serif;color:#1f1a16;direction:rtl;text-align:right;">
    <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0" style="direction:rtl;background:#f4f1ec;">
      <tr>
        <td align="center" dir="rtl" style="padding:24px;direction:rtl;">
          <table role="presentation" dir="rtl" width="560" cellpadding="0" cellspacing="0" border="0" style="direction:rtl;max-width:560px;width:100%;background:#ffffff;border-radius:18px;">
            <tr>
              <td dir="rtl" style="padding:26px;direction:rtl;text-align:right;">
                <div style="text-align:center;margin-bottom:14px;">
                  <span style="display:inline-block;padding:7px 12px;border-radius:999px;background:#1f1a16;color:#f7f3ec;font-size:12px;font-weight:700;">Meez Admin</span>
                </div>
                <h2 dir="rtl" style="margin:0 0 8px;font-size:20px;text-align:center;direction:rtl;">{{params.title}}</h2>
                <p dir="rtl" style="margin:0 0 16px;color:#6b6259;font-size:13px;text-align:center;direction:rtl;">{{params.event_label}} · {{params.occurred_at}}</p>
                <div dir="rtl" style="margin:0 0 16px;padding:14px 16px;background:#f7f3ec;border-radius:14px;direction:rtl;text-align:right;line-height:1.8;font-size:14px;">
                  {{params.details_html}}
                </div>
                <div style="text-align:center;margin:18px 0 0;">
                  <a href="{{params.admin_url}}" style="display:inline-block;background:#9b6a2f;color:#fff;text-decoration:none;padding:11px 20px;border-radius:999px;font-weight:700;">لوحة الإدارة</a>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
